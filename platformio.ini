; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings for all environments
[env]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
extra_scripts = post:rename_firmware.py

lib_deps =
    arduino-libraries/NTPClient
    adafruit/Adafruit NeoPixel
    mathertel/OneButton
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    https://github.com/kokke/tiny-AES-c.git

; Diese 6 Environments sind die Release-Builds (werden von
; .github/workflows/release.yml gebaut und als GitHub Release verteilt) -
; Serial-Debug-Logging (log.h) ist daher per -DLOG_ENABLED=0 abgeschaltet.
; Fuer lokales Debugging per "pio device monitor" das Flag im jeweiligen
; Environment vor dem Bauen temporaer auf 1 setzen oder entfernen.

; Deutsche Version (11x11 Matrix, 121 LEDs) - NTP Mode
[env:deutsche_11x11]
build_flags =
    -DVERSION_TYPE=0
    -DMATRIX_SIZE=11
    -DLED_COUNT=121
    -DLOG_ENABLED=0

; Bayrische Version (11x11 Matrix, 121 LEDs) - NTP Mode
[env:bayrisch_11x11]
build_flags =
    -DVERSION_TYPE=1
    -DMATRIX_SIZE=11
    -DLED_COUNT=121
    -DLOG_ENABLED=0

; Mini Version (8x8 Matrix, 64 LEDs) - NTP Mode
[env:mini_8x8]
build_flags =
    -DVERSION_TYPE=2
    -DMATRIX_SIZE=8
    -DLED_COUNT=64
    -DLOG_ENABLED=0

; Mini Version (8x8 Matrix, 64 LEDs) - NTP Mode, kkg-makerspace-Platine
; (identisch zu mini_8x8, nur LED_PIN 4 statt 2 und bt1Pin 5 statt 4)
[env:mini_8x8_kkg-makerspace]
build_flags =
    -DVERSION_TYPE=2
    -DMATRIX_SIZE=8
    -DLED_COUNT=64
    -DLOG_ENABLED=0
    -DLED_PIN=4
    -DBT1_PIN=5

; Deutsche Version (11x11 Matrix, 121 LEDs) - RCT Mode
[env:deutsche_11x11_rct]
build_flags =
    -DVERSION_TYPE=0
    -DMATRIX_SIZE=11
    -DLED_COUNT=121
    -DUSE_RCT
    -DLOG_ENABLED=0

; Bayrische Version (11x11 Matrix, 121 LEDs) - RCT Mode
[env:bayrisch_11x11_rct]
build_flags =
    -DVERSION_TYPE=1
    -DMATRIX_SIZE=11
    -DLED_COUNT=121
    -DUSE_RCT
    -DLOG_ENABLED=0

; Mini Version (8x8 Matrix, 64 LEDs) - RCT Mode
[env:mini_8x8_rct]
build_flags =
    -DVERSION_TYPE=2
    -DMATRIX_SIZE=8
    -DLED_COUNT=64
    -DUSE_RCT
    -DLOG_ENABLED=0